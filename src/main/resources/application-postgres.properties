# Perfil postgres: exige o docker-compose.yml rodando (ou um PostgreSQL propio)
# Variaveis com prefixo CAFETECH_ para nao colidir com DB_* globais da maquina
spring.datasource.url=${CAFETECH_DB_URL:jdbc:postgresql://localhost:5433/cafetech}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${CAFETECH_DB_USERNAME:cafetech}
spring.datasource.password=${CAFETECH_DB_PASSWORD:cafetech}
spring.jpa.hibernate.ddl-auto=update
