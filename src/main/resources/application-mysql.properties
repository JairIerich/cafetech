# Perfil mysql: exige o docker-compose.yml rodando (ou um MySQL propio)
# Variaveis com prefixo CAFETECH_ para nao colidir com DB_* globais da maquina
spring.datasource.url=${CAFETECH_DB_URL:jdbc:mysql://localhost:3307/cafetech}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${CAFETECH_DB_USERNAME:cafetech}
spring.datasource.password=${CAFETECH_DB_PASSWORD:cafetech}
spring.jpa.hibernate.ddl-auto=update
